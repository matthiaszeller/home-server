##########################################
# 📊 Grafana Configuration (proxied mode)
##########################################

[server]
# Protocol and port Grafana listens on inside its container
protocol = http
http_port = 3000

# The domain and public URL under which Grafana is accessed
domain = matthias-g-zeller.com
root_url = https://%(domain)s/protected/grafana/
serve_from_sub_path = true

##########################################
# 🔐 Authentication / Proxy Integration
##########################################

[auth]
# Disable Grafana's own login UI — authentication is handled by Vouch
disable_login_form = true
disable_signout_menu = true

# Optional (prevents anonymous redirect loops)
login_cookie_name = grafana_sso
login_maximum_inactive_lifetime_duration = 7d
login_maximum_lifetime_duration = 30d

[auth.proxy]
# Enable header-based authentication
enabled = true

# Header set by Nginx/Vouch for the authenticated user
header_name = X-Vouch-User

# Which field Grafana should use from that header
header_property = email

# Auto-create user accounts from the header on first login
auto_sign_up = true

# Optional: enforce only from trusted proxy IP (Nginx container)
# You can find the Nginx container's IP via `docker inspect`
# whitelist = 172.18.0.0/16

##########################################
# 👥 User defaults
##########################################

[users]
allow_sign_up = false
auto_assign_org = true
auto_assign_org_role = Editor
default_theme = dark

##########################################
# 🔒 Security settings
##########################################

[security]
admin_user = admin
admin_password = admin

# Cookies and session security
cookie_secure = true
cookie_samesite = lax
allow_embedding = true

##########################################
# 🪵 Logging
##########################################

[log]
mode = console
level = info

[log.console]
format = json
