
error_log /var/log/nginx/error.log notice;


# --- Redirect HTTP to HTTPS ---
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# --- Main HTTPS Server ---
server {

    listen 443 ssl;
    http2 on;
    server_name .matthias-g-zeller.com;

    # SSL certs issued by Cloudflare or Let's Encrypt
    ssl_certificate     /certs/edge/fullchain.pem;
    ssl_certificate_key /certs/edge/privkey.pem;
    ssl_protocols       TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # optional origin-pull CA (Cloudflare)
    ssl_client_certificate /certs/edge/cloudflare_origin_pull_ca.pem;
    ssl_verify_client on;
    ssl_verify_depth 2;

    # --- Vouch endpoints ---
    location /auth {
        proxy_pass         http://vouch:9090;
        proxy_set_header   Host $host;
    }

    location /login {
        proxy_pass         http://vouch:9090;
        proxy_set_header   Host $host;
    }

    location /logout {
        proxy_pass         http://vouch:9090;
        proxy_redirect     off;
        proxy_set_header   Host $host;
    }

    # --- Auth validation endpoint (used by auth_request) ---
    location = /validate {
        internal;
        proxy_pass              http://vouch:9090/validate;
        proxy_set_header        Host $host;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        auth_request_set        $auth_resp_x_vouch_user $upstream_http_x_vouch_user;
        auth_request_set        $auth_resp_jwt          $upstream_http_x_vouch_jwt;
        auth_request_set        $auth_resp_err          $upstream_http_x_vouch_err;
        auth_request_set        $auth_resp_failcount    $upstream_http_x_vouch_failcount;
    }

    # --- Public content (unprotected) ---
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /error/404.html;
    location = /error/404.html {
        root /usr/share/nginx/html;
        internal;
    }


    # -------------------------------
    #  Protected Zone
    # -------------------------------
    location /protected {
        auth_request /validate;
        auth_request_set $auth_resp_x_vouch_user $upstream_http_x_vouch_user;

        root /usr/share/nginx/html;
        index index.html;

        expires 0;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header Pragma "no-cache";

        error_page 401 = @prompt_login;

        # Debug service
        location /protected/debug_nginx_edge {
            rewrite ^/protected/debug_nginx_edge(.*) /$1 break;
            proxy_pass http://debug_nginx_edge:5000;
            include /etc/nginx/conf.d/common-headers.conf;
        }

        # Grafana dashboard
        location /protected/grafana/ {
            # rewrite ^/protected/grafana/?(.*)$ /$1 break;

            proxy_pass http://grafana:3000;  # CRITICAL: no trailing slash

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            include /etc/nginx/conf.d/common-headers.conf;
            proxy_set_header X-Forwarded-Prefix /protected/grafana;
            proxy_redirect off;
        }

        # Internal services
        # location /protected/invoice/ {
        #     rewrite ^/protected/invoice/(.*) /$1 break;
        #     proxy_pass http://invoice:5000;
        #     include /etc/nginx/conf.d/common-headers.conf;
        # }
    }

    location @prompt_login {
        return 302 https://matthias-g-zeller.com/login?url=$scheme://$http_host$request_uri&vouch-failcount=$auth_resp_failcount&X-Vouch-Token=$auth_resp_jwt&error=$auth_resp_err;
    }

}
